<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Paul's Pallet Walls mark">
  <!-- Soft ash field -->
  <rect width="64" height="64" rx="4" fill="#E6EBE7"/>
  <!-- Pine wall planks (vertical pallet boards) -->
  <rect x="10" y="8" width="12" height="48" rx="1.5" fill="#0E2419"/>
  <rect x="26" y="8" width="12" height="48" rx="1.5" fill="#1A3326"/>
  <rect x="42" y="8" width="12" height="48" rx="1.5" fill="#0E2419"/>
  <!-- Grain / board gaps -->
  <path d="M16 14v36M32 14v36M48 14v36" stroke="#264A36" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
  <!-- Brass cross-rails (pallet style) -->
  <rect x="8" y="20" width="48" height="3.5" rx="1" fill="#B08D3C"/>
  <rect x="8" y="40" width="48" height="3.5" rx="1" fill="#C9AE66"/>
</svg>
