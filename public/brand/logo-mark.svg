<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="Paul Bunyan's Pallet Walls mascot">
  <!-- Ash badge -->
  <rect width="96" height="96" rx="12" fill="#E6EBE7"/>
  <!-- Pallet wall backdrop (left) -->
  <g>
    <rect x="8" y="18" width="10" height="60" rx="1.5" fill="#0E2419"/>
    <rect x="20" y="18" width="10" height="60" rx="1.5" fill="#1A3326"/>
    <rect x="32" y="18" width="10" height="60" rx="1.5" fill="#0E2419"/>
    <rect x="6" y="32" width="38" height="3.5" rx="1" fill="#B08D3C"/>
    <rect x="6" y="52" width="38" height="3.5" rx="1" fill="#C9AE66"/>
  </g>
  <!-- Paul Bunyan mascot (right-forward) -->
  <!-- Cap -->
  <ellipse cx="64" cy="28" rx="18" ry="8" fill="#7A1F1F"/>
  <path d="M46 28c0-10 8-18 18-18s18 8 18 18" fill="#9B2C2C"/>
  <rect x="44" y="26" width="40" height="5" rx="1.5" fill="#5C1414"/>
  <!-- Face -->
  <ellipse cx="64" cy="42" rx="15" ry="14" fill="#D4A574"/>
  <!-- Eyes -->
  <circle cx="58" cy="40" r="1.8" fill="#0E2419"/>
  <circle cx="70" cy="40" r="1.8" fill="#0E2419"/>
  <!-- Nose -->
  <ellipse cx="64" cy="45" rx="2.2" ry="1.6" fill="#C4895A"/>
  <!-- Big lumberjack beard -->
  <path d="M50 48c2 14 10 22 14 24 4-2 12-10 14-24-4 4-10 6-14 6s-10-2-14-6z" fill="#3D2914"/>
  <path d="M54 50c3 10 7 15 10 17 3-2 7-7 10-17-3 3-7 4-10 4s-7-1-10-4z" fill="#5C3D1E"/>
  <!-- Plaid shirt collar / shoulders -->
  <path d="M46 68c4 6 10 10 18 10s14-4 18-10l-6 14H52l-6-14z" fill="#7A1F1F"/>
  <path d="M52 72h24v3H52z" fill="#B08D3C" opacity="0.85"/>
  <path d="M55 78h18v2H55z" fill="#C9AE66" opacity="0.7"/>
  <!-- Tiny axe peeking (handle + head) -->
  <rect x="82" y="48" width="3" height="28" rx="1" fill="#5C3D1E"/>
  <path d="M80 48h10l-2 8H82z" fill="#8A8F8A"/>
</svg>
